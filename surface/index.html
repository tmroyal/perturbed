<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Perturbed</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="transport">
    <button id="play">Play</button>
    <div class="group" title="Tempo of the main clock">
      <div id="tempo"></div>
      <span class="unit">BPM</span>
    </div>
    <div class="group" id="mod" title="Metric modulation: multiply the tempo by a fraction">
      <span class="unit">Modulate</span>
      <input id="mod-num" type="number" min="1" max="32" step="1" value="3">
      <span>/</span>
      <input id="mod-den" type="number" min="1" max="32" step="1" value="2">
      <button id="mod-swap" title="Swap to the reciprocal">⇅</button>
      <button id="mod-apply" title="Apply"></button>
    </div>
    <div class="group" title="Beats since play (main clock)">
      <span id="pulse"></span>
      <span id="beat"></span>
    </div>
    <div class="spacer"></div>
    <span id="status">waiting for the brain…</span>
    <button id="save">Save…</button>
    <button id="load">Open…</button>
  </header>

  <div id="main">
    <section id="gens-pane">
      <div class="pane-head"><h1>Chord</h1></div>
      <div id="chord" class="card">
        <div class="segmented" id="chord-mode" title="Auto: every chord you play replaces the current one. Arm: only the next chord after pressing Arm.">
          <button data-mode="auto">Auto</button><button data-mode="arm">Arm</button>
        </div>
        <button id="chord-arm">Arm</button>
        <div id="chord-notes"></div>
        <button id="chord-clear">Clear</button>
      </div>
      <div class="pane-head"><h1>Generators</h1><div id="add-gen"></div></div>
      <div id="grid"></div>
    </section>

    <aside id="sidebar">
      <div class="pane-head"><h1>Clocks</h1><button id="add-clock">+ Clock</button></div>
      <div id="clocks"></div>

      <div class="pane-head"><h1>Outputs</h1></div>
      <div id="outputs"></div>
      <form id="output-form" class="card">
        <div class="fields">
          <label for="output-name">name</label><input id="output-name" type="text" placeholder="Piano 3">
          <label>MIDI</label>
          <div class="row"><select id="output-port"></select><select id="output-channel"></select></div>
          <label for="output-inst">instrument</label><input id="output-inst" type="text" value="Pianoteq 9">
        </div>
        <button type="submit">+ Output</button>
      </form>
      <p class="hint">Each output is a REAPER track. After adding or removing outputs, run <b>setup.lua</b> in REAPER.</p>
    </aside>
  </div>

  <script src="ui.js"></script>
  <script src="transport.js"></script>
  <script src="generators.js"></script>
  <script src="sidebar.js"></script>
  <script src="app.js"></script>
</body>
</html>
